name: Integridade e seguranca
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integridade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validacao-local:
    name: Windows - seguranca e recuperacao
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SUPABASE_SERVICE_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      AGENTE_SEGREDO: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Dependencias fixadas
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Conferir segredos versionados
        shell: pwsh
        run: ./ferramentas/conferir-segredos.ps1 -TodosRastreados
      - name: Regressao de seguranca, backup e PDF com dados sinteticos
        shell: pwsh
        run: |
          python -m pytest -n 0 -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/pytest-ideal" --tb=short tests/test_backup_portatil.py tests/test_backup_storage.py tests/test_seguranca_estacao.py tests/test_email_envio.py tests/test_acesso_local.py tests/test_propostas_sem_anon.py tests/test_o_javascript_do_frontend_compila.py tests/test_multi_artes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contratos do navegador
        shell: pwsh
        run: |
          foreach ($arquivo in @('tests/token_estacao_harness.js','tests/grade_do_acesso_local_harness.js','tests/propostas_sem_anon_harness.js')) {
            node $arquivo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --test tests/auditoria_rls.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freios da publicacao
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          Install-Module Pester -RequiredVersion 4.10.1 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          $resultado = Invoke-Pester -Script tests/Publicacao.Tests.ps1 -PassThru
          if ($resultado.FailedCount -gt 0) { throw 'Regressao nos freios da publicacao' }
