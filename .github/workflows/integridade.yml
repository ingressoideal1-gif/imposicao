name: Integridade e seguranca
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: integridade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibilidade-dois-canais:
    name: NewProd e Piloto - ${{ matrix.canal }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        canal: [producao, piloto, oficial]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Dependencias fixadas
        shell: pwsh
        run: |
          python -m pip install -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contratos comuns e recursos do Piloto
        env:
          ENTREGA_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: pwsh
        run: |
          $navegadores = @('C:\Program Files\Google\Chrome\Application\chrome.exe', 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')
          $env:PUPPETEER_EXECUTABLE_PATH = $navegadores | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $env:PUPPETEER_EXECUTABLE_PATH) { throw 'Navegador de regressao ausente' }
          $argumentos = @('ferramentas/conferir_duas_versoes.py', '${{ matrix.canal }}', '--relatorio', 'dist/entrega/tempos-canais.json')
          if ($env:ENTREGA_BASE -and $env:ENTREGA_BASE -notmatch '^0+$') { $argumentos += @('--base', $env:ENTREGA_BASE) }
          python @argumentos
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  consulta-piloto:
    name: Piloto - consulta autenticada sem escrita
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - shell: pwsh
        run: npm ci --ignore-scripts
      - name: Piloto visivel na porta 9001 e ausente na producao
        shell: pwsh
        run: |
          $navegadores = @('C:\Program Files\Google\Chrome\Application\chrome.exe', 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe')
          $env:PUPPETEER_EXECUTABLE_PATH = $navegadores | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $env:PUPPETEER_EXECUTABLE_PATH) { throw 'Navegador de regressao ausente' }
          node tests/estatisticas_piloto_harness.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Autorizacao, empresa, origem e revisao
        shell: pwsh
        run: ./node_modules/@deno/win32-x64/deno.exe test --no-config --node-modules-dir=none --allow-env --allow-read --quiet supabase/functions/_compartilhado/piloto_catalogo_test.ts supabase/functions/_compartilhado/piloto_estacao_test.ts supabase/functions/_compartilhado/piloto_local_test.ts supabase/functions/_compartilhado/piloto_vinculo_test.ts supabase/functions/_compartilhado/piloto_pedido_test.ts supabase/functions/_compartilhado/piloto_multiplas_estacoes_test.ts
  validacao-local:
    needs: [compatibilidade-dois-canais, consulta-piloto]
    name: Windows - seguranca e recuperacao
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SUPABASE_SERVICE_KEY: ''
      SUPABASE_SERVICE_ROLE_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      AGENTE_SEGREDO: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Dependencias fixadas
        shell: pwsh
        run: |
          python -m pip install pip==26.2.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Conferir segredos versionados
        shell: pwsh
        run: ./ferramentas/conferir-segredos.ps1 -TodosRastreados
      - name: Regressao de seguranca, backup e PDF com dados sinteticos
        shell: pwsh
        run: |
          python -m pytest -n 0 -p no:cacheprovider --basetemp "$env:RUNNER_TEMP/pytest-ideal" --tb=short tests/test_runtime_portatil.py tests/test_migracao_estacao.py tests/test_sincronizar_git.py tests/test_compatibilidade_painel.py tests/test_credencial_publicacao.py tests/test_backup_portatil.py tests/test_backup_storage.py tests/test_storage_download.py tests/test_seguranca_estacao.py tests/test_email_envio.py tests/test_acesso_local.py tests/test_propostas_sem_anon.py tests/test_o_javascript_do_frontend_compila.py tests/test_multi_artes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contratos do navegador
        shell: pwsh
        run: |
          foreach ($arquivo in @('tests/config_aproveitamento_harness.js','tests/upgrade_estacao_harness.js','tests/token_estacao_harness.js','tests/grade_do_acesso_local_harness.js','tests/propostas_sem_anon_harness.js')) {
            node $arquivo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node --test tests/auditoria_rls.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Contrato de configuracao administrativa
        shell: pwsh
        run: |
          npm exec --yes --package=deno@2.9.5 -- deno test --node-modules-dir=none --allow-env --allow-read --quiet supabase/functions/_compartilhado/config_aproveitamento_test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freios da publicacao
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p test_entrega_impacto.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) { Register-PSRepository -Default }
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -eq ([version]'5.9.0'))) { Install-Module Pester -RequiredVersion 5.9.0 -Scope CurrentUser -Repository PSGallery -Force }
          Import-Module Pester -RequiredVersion 5.9.0 -Force
          $resultado = Invoke-Pester -Path @('tests/Publicacao.Tests.ps1','tests/EntregaSegura.Tests.ps1') -PassThru
          if ($resultado.FailedCount -gt 0) { throw 'Regressao nos freios da publicacao' }
