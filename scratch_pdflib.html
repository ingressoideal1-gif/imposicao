<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
    <button onclick="test()">Generate PDF</button>
    <script>
        async function test() {
            const { PDFDocument, PDFName, PDFString, PDFNumber } = PDFLib;
            const pdfDoc = await PDFDocument.create();
            
            pdfDoc.addPage([200, 200]);
            pdfDoc.addPage([200, 200]);
            
            const nums = [];
            
            // Page 0
            nums.push(PDFNumber.of(0));
            nums.push(pdfDoc.context.obj({
                Type: 'PageLabel',
                P: PDFString.of('1000001')
            }));
            
            // Page 1
            nums.push(PDFNumber.of(1));
            nums.push(pdfDoc.context.obj({
                Type: 'PageLabel',
                P: PDFString.of('1000002')
            }));
            
            const numTree = pdfDoc.context.obj({
                Nums: nums
            });
            
            pdfDoc.catalog.set(PDFName.of('PageLabels'), numTree);
            
            const pdfBytes = await pdfDoc.save();
            const blob = new Blob([pdfBytes], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            window.open(url);
        }
    </script>
</body>
</html>
