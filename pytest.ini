[pytest]
# Uma thread que morre com excecao nao pode ser um sussurro.
#
# O agente publica a faixa de codigos numa thread de fundo, e `_publicar_protegido`
# existe justamente para NUNCA levantar: se ela morresse, o operador nao veria nada
# e a portaria e que descobriria, dias depois, que metade dos ingressos nao valida.
#
# Em 14/08/2026 essa protecao falhou de um jeito que so este filtro pega. Um
# parametro novo em `publicar_em_fundo` deixou o substituto do teste com a
# assinatura velha; a thread morria com TypeError, e o teste continuava PASSANDO
# porque so media tempo. O pytest avisava — como aviso, no meio de outros.
#
# Com `error`, a suite falha. E o aviso do httpx vem do starlette e nao e nosso.
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning

# A suite roda em PARALELO por padrao.
#
# Ela levava 6 minutos, e o motivo nao era a quantidade de testes: uns 300 deles
# sobem um Chrome de verdade, e so subir e fechar o navegador custa ~470 ms.
# Trezentos lancamentos em fila sao cinco minutos de espera.
#
# `loadgroup` espalha teste a teste, respeitando a marca `xdist_group` que o
# `tests/conftest.py` poe nos poucos arquivos que gravam PDF com nome relativo
# na pasta do repositorio -- esses continuam um de cada vez, no mesmo processo.
#
# 8 processos, e nao `auto`: a maquina tem 16 nucleos, e 16 Chromes ao mesmo
# tempo disputam disco e memoria mais do que aceleram.
#
# Para depurar um teste em serie: `-p no:xdist`.
addopts = -n 8 --dist loadgroup

markers =
    xdist_group: mantem os testes marcados no mesmo processo (ver tests/conftest.py)
