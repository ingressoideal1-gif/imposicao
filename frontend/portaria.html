<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Portaria — Ideal Control</title>
    <meta name="theme-color" content="#0a0f1e">
    <meta name="description" content="Leitura de ingressos no aparelho. Funciona sem rede.">
    <link rel="manifest" href="app.webmanifest">
    <link rel="icon" href="icones/portaria-192.png" type="image/png">
    <link rel="preload" href="ideal-control.woff2" as="font" type="font/woff2" crossorigin>

    <!--
        O iOS NAO le o manifesto: nome, icone e "abrir sem barra do Safari" so
        saem destas metas. Sem elas, "Adicionar a Tela de Inicio" no iPhone cria
        um atalho com print da pagina no lugar do icone, e abre dentro do Safari
        com a barra ocupando a tela.

        `black-translucent` combina com o `viewport-fit=cover` e o
        `env(safe-area-inset-*)` que o `body` ja usa: a cor da pagina sobe ate
        embaixo do relogio, e nada de util fica escondido pelo entalhe.

        Um efeito colateral que vale saber: instalado na tela de inicio, o iOS
        deixa de apagar o armazenamento do site depois de 7 dias sem uso. A
        carga do evento e a fila de leituras que ainda nao subiram vivem no
        IndexedDB -- sem instalar, um celular parado entre um evento e outro
        pode acordar vazio.
    -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Portaria">
    <!--
        A tela do porteiro. Uma mao, no escuro, com sol de refletor na cara e a
        fila andando. Por isso: alvos de toque grandes, cor ocupando a tela
        inteira na RECUSA, e nenhuma decisao escondida atras de menu.

        Desde 16/08/2026 o ingresso BOM nao ocupa mais a tela: a camera fica
        ligada, a faixa verde troca de conteudo e a proxima pessoa passa sem
        ninguem tocar em nada. Numa noite de dois mil ingressos, a tela antiga
        pedia dois mil toques em "Ler o proximo" -- com uma mao, no escuro.

        Auto-contida como as outras telas do aplicativo, e por um motivo a
        mais: esta pagina precisa ABRIR SEM REDE. Todo arquivo que ela usa e
        local -- nao ha CDN nenhum aqui, e nao pode haver.
    -->
    <style>
        /* A identidade visual do Ideal Control na tela do portao. As mesmas
           cores e a mesma fonte da casa (`controle.css`) -- reescritas aqui,
           inline, porque esta pagina precisa ABRIR SEM REDE e nao carrega
           folha nenhuma. A fonte e o unico arquivo a mais, e ela e local:
           `ideal-control.woff2`, no pre-cache do service worker. */
        @font-face {
            font-family: 'Manrope';
            font-style: normal;
            font-weight: 400 800;
            font-display: swap;
            src: url(ideal-control.woff2) format('woff2');
        }
        :root {
            --bg: #0a0f1e; --card: #121b30; --card-2: #182339;
            --border: rgba(148,163,184,0.16); --border-forte: rgba(148,163,184,0.30);
            --text: #eef2f8; --dim: #9aa6bb; --apagado: #64718a;
            --verde: #16a34a; --vermelho: #b91c1c; --laranja: #c2410c;
            --teal: #14b8a6; --teal-claro: #2dd4bf; --azul: #3b82f6;
            /* O verde do fundo escuro nao serve para TEXTO: #16a34a sobre
               #0a0f1e fica ilegivel de longe, que e como o porteiro le. */
            --verde-claro: #4ade80;
        }
        * { box-sizing: border-box; }
        html { background: var(--bg); }
        body {
            margin: 0; min-height: 100vh; color: var(--text);
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
            /* O mesmo brilho verde-agua → azul da casa, mais discreto: aqui a
               camera e a resposta e que mandam na tela. */
            background:
                radial-gradient(760px 420px at 15% -10%, rgba(20,184,166,.18), transparent 60%),
                radial-gradient(640px 400px at 100% -6%, rgba(59,130,246,.14), transparent 60%),
                var(--bg);
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
        }
        .folha { max-width: 520px; margin: 0 auto; padding: 14px; }
        .topo {
            display: flex; align-items: center;
            gap: 12px; font-size: 0.82rem; color: var(--dim); margin-bottom: 14px;
        }
        .topo > span { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
        .topo strong { color: var(--text); font-size: 1.15rem; font-weight: 800; letter-spacing: -0.015em; line-height: 1.2; }
        /* Os setores que este aparelho valida, em verde: e a resposta muda para
           "esta pessoa esta na fila certa?", que o porteiro faz o tempo todo. */
        #topo-setores { color: var(--verde-claro); font-size: 0.78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
        h1 { font-size: 1.3rem; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.015em; }
        .sumindo { display: none !important; }

        input {
            width: 100%; padding: 14px; font-size: 1.25rem; letter-spacing: 0.12em;
            font-weight: 700; font-variant-numeric: tabular-nums;
            background: rgba(2,6,23,0.55); border: 1px solid var(--border-forte);
            border-radius: 12px; color: var(--text); font-family: inherit;
            text-align: center; text-transform: uppercase;
        }
        input:focus { outline: none; border-color: var(--teal-claro); box-shadow: 0 0 0 3px rgba(45,212,191,.28); }
        input::placeholder { color: var(--apagado); font-weight: 600; }
        button {
            width: 100%; padding: 16px; font-size: 1.05rem; font-weight: 700;
            font-family: inherit; border: 0; border-radius: 12px;
            background: linear-gradient(135deg, var(--teal-claro), var(--teal) 55%, #0ea5a0);
            color: #04201c; margin-top: 14px;
            min-height: 56px; cursor: pointer;
            box-shadow: 0 10px 22px -12px rgba(20,184,166,.75), inset 0 1px 0 rgba(255,255,255,.22);
            transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;
        }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:focus-visible { outline: 2px solid #e2e8f0; outline-offset: 2px; }
        button.discreto { background: rgba(255,255,255,.04); color: #cbd5e1; border: 1px solid var(--border-forte); box-shadow: none; }
        button:disabled { opacity: 0.5; box-shadow: none; }

        /* O retorno para a lista de eventos. Alvo de toque grande, mas sem cor
           de acao: ele nao compete com nada nesta tela. */
        #btn-voltar {
            width: 46px; flex: none; margin: 0; padding: 0; min-height: 46px;
            font-size: 1.3rem; line-height: 1;
            background: rgba(255,255,255,.04); color: var(--text);
            border: 1px solid var(--border-forte); border-radius: 50%; box-shadow: none;
        }

        /* A RECUSA ocupa a tela: o porteiro le de longe, com o celular na mao
           esticada e a pessoa esperando. Cor cheia, e uma luz por dentro que da
           volume sem tirar contraste. */
        .resposta {
            border-radius: 20px; padding: 32px 20px; text-align: center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 20px 50px -24px rgba(0,0,0,.8);
            animation: surgir .22s cubic-bezier(.2,.7,.2,1) both;
        }
        .resposta.ok       { background: linear-gradient(180deg, #22c55e, var(--verde)); }
        .resposta.recusa   { background: linear-gradient(180deg, #dc2626, var(--vermelho)); }
        /* Laranja, e nao vermelho: ingresso bom na porta errada NAO e a mesma
           coisa que ingresso estranho ao evento. */
        .resposta.porta    { background: linear-gradient(180deg, #ea580c, var(--laranja)); }
        .resposta .marca   { font-size: 3.4rem; line-height: 1; }
        .resposta .titulo  { font-size: 1.6rem; font-weight: 800; margin: 10px 0 4px; letter-spacing: -0.01em; }
        .resposta .detalhe { font-size: 1.05rem; opacity: 0.95; }
        /* O motivo do bloqueio e o que o porteiro le em voz alta. */
        .resposta .motivo  { font-size: 1.35rem; font-weight: 700; margin-top: 10px; }
        .resposta .grande  { font-size: 2.2rem; font-weight: 800; margin-top: 6px; letter-spacing: -0.01em; }
        @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        .escolha { display: grid; gap: 12px; margin-top: 16px; }
        .escolha button { margin: 0; font-size: 1.25rem; padding: 22px; }

        .aviso {
            font-size: 0.86rem; padding: 12px 14px; border-radius: 12px;
            background: rgba(245,158,11,0.10); border: 1px solid rgba(245,158,11,.3);
            color: #d6dceb; margin-top: 12px;
        }

        /* ── O visor da camera ─────────────────────────────────────────────
           O video com cantoneiras verde-agua nos quatro cantos: e o que diz
           "aponte aqui" sem uma palavra. As cantoneiras sao oito degrades num
           unico pseudo-elemento -- nenhum elemento a mais por cima do video,
           que precisa continuar leve. */
        .visor { position: relative; border-radius: 16px; overflow: hidden; background: #000; }
        .cam { width: 100%; background: #000; aspect-ratio: 4/3; display: block; }
        .visor::after {
            content: ""; position: absolute; inset: 12px; z-index: 1; pointer-events: none;
            --c: var(--teal-claro); --l: 30px; --e: 3px;
            background:
                linear-gradient(var(--c), var(--c)) top left / var(--l) var(--e) no-repeat,
                linear-gradient(var(--c), var(--c)) top left / var(--e) var(--l) no-repeat,
                linear-gradient(var(--c), var(--c)) top right / var(--l) var(--e) no-repeat,
                linear-gradient(var(--c), var(--c)) top right / var(--e) var(--l) no-repeat,
                linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--e) no-repeat,
                linear-gradient(var(--c), var(--c)) bottom left / var(--e) var(--l) no-repeat,
                linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--e) no-repeat,
                linear-gradient(var(--c), var(--c)) bottom right / var(--e) var(--l) no-repeat;
            filter: drop-shadow(0 0 6px rgba(45,212,191,.55));
        }
        /* A linha que varre o visor: discreta, so para dizer que a camera esta
           VIVA. Some para quem pediu ao sistema menos movimento. */
        .visor::before {
            content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
            /* A linha e desenhada no MEIO de um elemento do tamanho do visor, e
               e o elemento inteiro que sobe e desce: `translateY` em
               porcentagem e do proprio elemento, entao um risco de 2px so
               andaria 2px. */
            background: linear-gradient(180deg,
                transparent calc(50% - 1px), rgba(45,212,191,.8) 50%, transparent calc(50% + 1px));
            -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
                    mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
            animation: varrer 2.8s ease-in-out infinite alternate;
        }
        @keyframes varrer { from { transform: translateY(-36%); } to { transform: translateY(36%); } }
        @media (prefers-reduced-motion: reduce) {
            .visor::before { display: none; }
            .resposta { animation: none; }
            button { transition: none; }
        }

        /* ── A faixa da ultima leitura ─────────────────────────────────────
           Ela TROCA de conteudo a cada ingresso bom, e e o unico retorno visual
           do caminho feliz. A hora vai junto. */
        .rotulo {
            text-align: center; color: var(--dim); font-size: 0.72rem; font-weight: 800;
            letter-spacing: 0.14em; text-transform: uppercase; margin: 14px 0 6px;
        }
        .faixa {
            border-radius: 14px; padding: 16px 12px; text-align: center;
            background: linear-gradient(180deg, #22c55e, var(--verde)); color: #fff;
            font-size: 1.3rem; font-weight: 800; min-height: 60px;
            word-break: break-word;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 12px 28px -16px rgba(34,197,94,.7);
        }
        /* Antes da primeira leitura nao ha verde nenhum: verde vazio na tela e
           um "pode entrar" sem ingresso nenhum atras. */
        .faixa.vazia {
            background: rgba(255,255,255,.04); color: var(--dim);
            border: 1px dashed var(--border-forte);
            font-size: 0.95rem; font-weight: 600; box-shadow: none;
        }

        /* ── O contador ────────────────────────────────────────────────────
           Destacado, sempre a vista. Soma TODOS os setores deste aparelho. */
        .contador {
            margin-top: 12px; padding: 14px 10px; text-align: center;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(20,184,166,.16), rgba(59,130,246,.10));
            border: 1px solid rgba(20,184,166,.4); color: var(--teal-claro);
            font-size: 1.7rem; font-weight: 800; letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
        }
        /* As leituras que ainda nao subiram andam JUNTO do contador. Somem
           quando zeram. */
        .contador .pendentes { font-size: 0.85rem; font-weight: 600; color: var(--dim); letter-spacing: 0; }

        /* ── O rodape ──────────────────────────────────────────────────────
           A lanterna e icone ao lado do "Digitar o numero". Ela continua
           sumindo onde a lanterna nao existe de verdade. */
        .rodape { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
        .rodape button { margin-top: 0; }
        #btn-lanterna {
            width: 64px; flex: 0 0 64px; padding: 0; font-size: 1.6rem;
            background: rgba(255,255,255,.04); border: 1px solid var(--border-forte); box-shadow: none;
        }
        #btn-lanterna.acesa { background: rgba(245,158,11,0.25); border-color: #f59e0b; }
        #btn-digitar { flex: 1 1 auto; }
        #caixa-digitar { margin-top: 12px; }

        /* ── O toque que destrava o som ────────────────────────────────────
           Navegador nenhum toca audio antes de a pessoa encostar na tela, e ler
           QR nao conta como encostar. Cobre a area de trabalho, e NAO a tela
           inteira: o `←` do topo fica fora dele de proposito. */
        #tela-lendo { position: relative; }
        #btn-toque {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            /* Sem canto arredondado: o canto deixaria aparecer a borda do
               "Digitar o numero" por baixo. */
            width: 100%; margin: 0; border-radius: 0; z-index: 20;
            background:
                radial-gradient(520px 320px at 50% 30%, rgba(20,184,166,.20), transparent 62%),
                var(--bg);
            color: var(--text);
            font-size: 1.5rem; font-weight: 800; box-shadow: none;
        }

        /* A faixa de atualizacao NAO e um botao de acao: menor e discreta, de
           proposito. */
        #faixa-atualizacao {
            margin: 0 0 12px; padding: 10px 14px; min-height: 0;
            font-size: 0.85rem; font-weight: 700;
            background: rgba(20,184,166,0.12); color: var(--teal-claro);
            border: 1px solid rgba(20,184,166,0.45); box-shadow: none;
        }
    </style>
</head>
<body>
<div class="folha">
    <!-- Escondida ate existir versao nova instalada e esperando a vez. -->
    <button id="faixa-atualizacao" class="sumindo" type="button">
        Atualização disponível — toque para aplicar
    </button>

    <div class="topo">
        <!--
            O retorno para a lista de eventos. Ele NAO exige fila zerada: aquela
            trava existe para quando o aparelho troca de IDENTIDADE (vira portão
            de outro evento, com token novo), e ir e voltar da lista não troca o
            token — a fila sobe igual depois. A trava fica onde importa, no
            "Sair deste portão" da engrenagem.
        -->
        <button id="btn-voltar" class="sumindo" type="button"
                title="Voltar para a lista de eventos"
                aria-label="Voltar para a lista de eventos">←</button>
        <span><strong id="topo-aparelho">Portaria</strong><span id="topo-setores"></span></span>
    </div>

    <!--
        O recado, no lugar da antiga tela de digitar o código.

        Não há mais código de 6 caracteres: quem põe um portão no ar é o dono,
        na casa do aplicativo, tocando na barra do evento com a conta dele. Um
        aparelho que abre sem token já não para aqui — ele vai direto para a
        lista.

        O que sobrou desta tela é o que ela fazia de mais importante: dizer POR
        QUE este celular parou de ler. Sem uma frase, o aparelho desligado pelo
        organizador e o aparelho sem sinal têm a mesma cara — uma tela que não
        responde.
    -->
    <div id="tela-aviso" class="sumindo">
        <h1>Este aparelho não está lendo</h1>
        <div id="erro-aviso" class="aviso sumindo" role="alert"></div>
    </div>

    <div id="tela-carregando" class="sumindo">
        <h1>Baixando o evento</h1>
        <p style="color:var(--dim);" id="carregando-conta">…</p>
        <div class="aviso">
            Depois disso o aparelho funciona sem internet. Espere terminar antes
            de ir para a leitura.
        </div>
    </div>

    <div id="tela-lendo" class="sumindo">
        <div class="visor"><video id="cam" class="cam" playsinline muted></video></div>

        <div class="rotulo">Última leitura</div>
        <div id="faixa-ultima" class="faixa vazia">Nenhum ingresso lido ainda</div>

        <!-- `entraram / contratado · N não enviadas`. O denominador é a
             quantidade CONTRATADA no ERP, que é a regra do projeto para
             lotação. -->
        <div class="contador">
            <span id="contador-numeros">…</span><span id="contador-pendentes" class="pendentes"></span>
        </div>

        <div class="rodape">
            <!-- Só aparece onde a lanterna existe de verdade (Chrome no
                 Android). Botão morto no escuro faz o porteiro achar que o
                 aparelho travou. -->
            <button id="btn-lanterna" class="sumindo" type="button"
                    title="Lanterna" aria-label="Acender a lanterna">🔦</button>
            <button id="btn-digitar" class="discreto">Digitar o número</button>
        </div>

        <div id="caixa-digitar" class="sumindo">
            <input id="campo-numero" inputmode="numeric" placeholder="000001">
            <button id="btn-conferir">Conferir</button>
        </div>

        <!--
            O toque que destrava o som. Cobre a tela ao entrar na leitura e sai
            no primeiro toque, que é o mesmo que abre a câmera.

            A alternativa — tentar apitar sem permissão — falha EM SILÊNCIO, que
            é o modo de errar que esta tela inteira existe para evitar.
        -->
        <button id="btn-toque" class="sumindo" type="button">
            Toque para começar a ler
        </button>
    </div>

    <!--
        A recusa continua ocupando a tela e continua exigindo um toque: é a
        única forma de garantir que o porteiro viu. O ingresso BOM não passa
        mais por aqui.
    -->
    <div id="tela-resposta" class="sumindo">
        <div class="resposta" id="resposta-caixa">
            <div class="marca" id="resposta-marca"></div>
            <div class="titulo" id="resposta-titulo"></div>
            <div class="detalhe" id="resposta-detalhe"></div>
            <div class="grande" id="resposta-grande"></div>
            <div class="motivo" id="resposta-motivo"></div>
        </div>
        <button id="btn-proximo">Ler o próximo</button>
    </div>

    <div id="tela-ambiguo" class="sumindo">
        <h1>Qual setor?</h1>
        <p style="color:var(--dim);font-size:0.9rem;">
            Este número existe em mais de um setor que este aparelho atende.
        </p>
        <div class="escolha" id="escolha-setores"></div>
    </div>

    <!--
        A recusa de sair do portão com leitura ainda na fila.

        Fica FORA das telas porque não pertence a nenhuma. O botão que a
        disparava saiu da tela de trabalho em 16/08/2026: o retorno do topo leva
        à mesma lista, e trocar a identidade deste celular passa pela engrenagem
        do evento, que pede a senha do dono.
    -->
    <div id="erro-configurar" class="aviso sumindo" role="alert"></div>
</div>

<script src="jsqr.min.js?v=631"></script>
<script src="qr-ideal-hash.js?v=631"></script>
<script src="portaria-validacao.js?v=631"></script>
<script src="portaria-deposito.js?v=631"></script>
<script src="portaria-camera.js?v=631"></script>
<script src="aviso-sonoro.js?v=631"></script>
<script src="portaria-sincronismo.js?v=631"></script>
<script src="portaria.js?v=631"></script>
<script src="sw-registro.js?v=631"></script>
</body>
</html>
